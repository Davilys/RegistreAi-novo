name: RegistreAi UI Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_WHATSAPP_NUMBER: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=optional
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:ui -- --workers=1
      - name: Build previous release for measured mobile comparison
        run: |
          git worktree add --detach /tmp/registreai-before cada12093b38ccc233fcface7a7e1550b106363a
          npm --prefix /tmp/registreai-before ci --include=optional
          npm --prefix /tmp/registreai-before run build
      - name: Compare mobile page height with previous release
        run: node tests/ui/measure-mobile.mjs /tmp/registreai-before/dist dist test-results/mobile-comparison.json
      - name: Preserve screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registreai-ui-review
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
