services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    restart: unless-stopped
    networks:
      - registreai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - registreai

  reg-worker:
    profiles: ["worker"]
    build:
      context: ./services/reg-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/hostinger/.env.worker
    networks:
      - registreai

networks:
  registreai:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
